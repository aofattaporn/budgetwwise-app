<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Smart budget planning and expense tracking.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BudgetWise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BudgetWise</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Flutter's engine removes the viewport tag above on startup and appends
    // its own with maximum-scale=5.0, which re-enables iOS focus-zoom that the
    // user can't pinch back out of (Flutter swallows the gesture). Re-lock it.
    (function () {
      var locked = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
      new MutationObserver(function () {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta && meta.content !== locked) meta.content = locked;
      }).observe(document.head, { childList: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
